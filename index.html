<!doctype html>
<html lang="ko" data-mode="static">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 게시판</title>
  <link rel="stylesheet" href="style.css?v=daily-calendar-20261025">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='4' fill='%235b5bd6'/%3E%3Cpath d='M4.5 8.2l2.2 2.2 4.8-4.8' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script type="module" src="app.js?v=sunday-calendar-20261025"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" hidden></aside>
    <div class="side-backdrop" id="side-backdrop" hidden></div>
    <div class="content">
      <header class="mobilebar" id="mobilebar" hidden>
        <button type="button" class="icon-btn" id="menu-btn" aria-label="메뉴 열기">☰</button>
        <span id="mobile-title"></span>
      </header>
      <main id="main"><p class="muted pad">불러오는 중…</p></main>
    </div>
    <aside class="peek" id="peek" hidden aria-label="업무 상세"></aside>
    <button type="button" class="fab" id="fab" hidden aria-label="업무 추가">+</button>
    <nav class="tabbar" id="tabbar" hidden aria-label="주요 메뉴"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
